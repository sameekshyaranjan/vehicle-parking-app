<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Parking App V2</title>
    <meta name="description" content="Smart parking management system for 4-wheeler vehicles">
    
    
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    
    <style>
        :root {
            --primary-color: #000133;
            --secondary-color: #4B006E;
            --text-accent: #8AB8FE;
            --gradient-primary: linear-gradient(135deg, #000133, #4B006E);
            --gradient-secondary: linear-gradient(135deg, #4B006E, #8AB8FE);
            --gradient-light: linear-gradient(135deg, rgba(138,184,254,0.1), rgba(255,255,255,0.9));
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--gradient-primary);
            min-height: 100vh;
        }
        
        /* Global Bootstrap overrides */
        .btn-primary {
            background: var(--gradient-secondary);
            border: none;
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--gradient-primary);
            border: none;
        }
        
        .text-primary {
            color: var(--primary-color) !important;
        }
        
        .text-secondary {
            color: var(--secondary-color) !important;
        }
        
        .text-accent {
            color: var(--text-accent) !important;
        }
        
        .bg-primary {
            background: var(--primary-color) !important;
        }
        
        .bg-secondary {
            background: var(--secondary-color) !important;
        }
        
        .bg-gradient-primary {
            background: var(--gradient-primary) !important;
        }
        
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,1,51,0.1);
        }
        
        .navbar-brand {
            font-weight: bold;
            color: var(--primary-color) !important;
        }
        
        /* Loading spinner */
        .parking-spinner {
            border: 4px solid rgba(138,184,254,0.3);
            border-top: 4px solid var(--text-accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <noscript>
        <div class="container mt-5">
            <div class="alert alert-danger" role="alert">
                <h4 class="alert-heading">JavaScript Required!</h4>
                <p>We're sorry but Vehicle Parking App V2 doesn't work properly without JavaScript enabled. Please enable it to continue.</p>
            </div>
        </div>
    </noscript>
    
    
    <div id="app">
        
        <div class="d-flex justify-content-center align-items-center min-vh-100">
            <div class="text-center">
                <div class="parking-spinner mx-auto mb-3"></div>
                <h5 class="text-white">Loading Vehicle Parking System...</h5>
                <p class="text-white-50">Please wait while we prepare your parking experience</p>
            </div>
        </div>
    </div>
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
